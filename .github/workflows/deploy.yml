name: CI/CD Pipeline

on:
  push:
    branches: [main]

permissions:
  packages: write
  contents: read

jobs:
  # ==========================================
  # ЭТАП 1: Тестирование и проверка (CI)
  # ==========================================
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Build TypeScript
        env:
          DATABASE_URL: "postgresql://mock_user:mock_password@localhost:5432/mock_db"
          AUTH_SECRET: "temporary_secret_for_building_purposes_only"
          AUTH_GOOGLE_ID: "temporary_google_id"
          AUTH_GOOGLE_SECRET: "temporary_google_secret"
          AUTH_YANDEX_ID: "temporary_yandex_id"
          AUTH_YANDEX_SECRET: "temporary_yandex_secret"
          AUTH_VK_ID: "temporary_vk_id"
          AUTH_VK_SECRET: "temporary_vk_secret"
        run: npm run build --if-present

  # ==========================================
  # ЭТАП 2: Сборка Docker и деплой на Рег.ру (CD)
  # ==========================================
  deploy:
    runs-on: ubuntu-latest
    needs: build-and-test
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/spectr1962/test2:latest
          # Передаем заглушки как аргументы сборки для выполнения next build внутри Docker
          build-args: |
            DATABASE_URL=postgresql://mock_user:mock_password@localhost:5432/mock_db
            AUTH_SECRET=temporary_secret_for_building_purposes_only
            AUTH_GOOGLE_ID=temporary_google_id
            AUTH_GOOGLE_SECRET=temporary_google_secret
            AUTH_YANDEX_ID=temporary_yandex_id
            AUTH_YANDEX_SECRET=temporary_yandex_secret
            AUTH_VK_ID=temporary_vk_id
            AUTH_VK_SECRET=temporary_vk_secret

      - name: Deploy to Reg.ru VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOST }}
          username: ${{ secrets.USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          script: |
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u spectr1962 --password-stdin
            docker pull ghcr.io/spectr1962/test2:latest
            docker stop my-ts-app || true
            docker rm my-ts-app || true
            docker run -d \
              --name my-ts-app \
              -p 3001:3001 \
              -e DATABASE_URL="${{ secrets.REAL_DATABASE_URL }}" \
              -e AUTH_SECRET="${{ secrets.REAL_AUTH_SECRET }}" \
              -e AUTH_GOOGLE_ID="${{ secrets.REAL_AUTH_GOOGLE_ID }}" \
              -e AUTH_GOOGLE_SECRET="${{ secrets.REAL_AUTH_GOOGLE_SECRET }}" \
              -e AUTH_YANDEX_ID="${{ secrets.REAL_AUTH_YANDEX_ID }}" \
              -e AUTH_YANDEX_SECRET="${{ secrets.REAL_AUTH_YANDEX_SECRET }}" \
              -e AUTH_VK_ID="${{ secrets.REAL_AUTH_VK_ID }}" \
              -e AUTH_VK_SECRET="${{ secrets.REAL_AUTH_VK_SECRET }}" \
              --restart unless-stopped \
              ghcr.io/spectr1962/test2:latest
